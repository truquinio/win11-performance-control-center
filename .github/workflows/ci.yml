name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build static demo
        run: npm run build:demo

      - name: Restore
        run: dotnet restore Win11PerformanceControlCenter.slnx --nologo

      - name: Build Release
        run: dotnet build Win11PerformanceControlCenter.slnx -c Release --no-restore --nologo --verbosity minimal -warnaserror

      - name: Test
        run: dotnet test tests\App.Tests\App.Tests.csproj -c Release --no-build --nologo --verbosity minimal

      - name: Whitespace format gate
        run: dotnet format Win11PerformanceControlCenter.slnx whitespace --verify-no-changes --no-restore

      - name: Code-style gate
        run: dotnet format Win11PerformanceControlCenter.slnx style --verify-no-changes --severity warn --no-restore

      - name: Analyzer gate
        run: dotnet format Win11PerformanceControlCenter.slnx analyzers --verify-no-changes --severity warn --no-restore

      - name: NuGet vulnerability audit
        run: dotnet list Win11PerformanceControlCenter.slnx package --vulnerable --include-transitive

      - name: NPM production audit
        run: npm audit --omit=dev
